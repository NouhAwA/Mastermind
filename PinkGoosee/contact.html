<body>

<header class="site-header">
  <a href="index.html" class="logo">Pink <span>Goose</span></a>
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="learn.html">Learn</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
  <a href="contact.html" class="login-button">Login</a>
</header>

<main>
  <section class="content-section contact-section">
    <h2>What's your GOOSE idea?</h2>
    <p>Let's chat and see how we can help</p>

    <div class="contact-buttons">
      <a href="https://t.me/superdao_team"
         class="contact-button telegram-button">
        ➤ Telegram
        <small>@superdao_team</small>
      </a>

      <a href="mailto:hello@superdao.co"
         class="contact-button email-button">
        @ Email
        <small>hello@superdao.co</small>
      </a>
    </div>

    <form class="contact-form"
          action="mailto:hello@superdao.co"
          method="post"
          enctype="text/plain">

      <h2>Send a post Goose</h2>

      <input type="email"
             name="email"
             placeholder="Your email"
             required>

      <input type="text"
             name="name"
             placeholder="Your name"
             required>

      <textarea name="message"
                placeholder="Your message"
                required></textarea>

      <select name="goose-color" required>
        <option value="">Color of your goose</option>
        <option value="red">Red</option>
        <option value="white">White</option>
        <option value="blue">Blue</option>
        <option value="black">Black</option>
      </select>

      <button type="submit" class="pink-button">
        Send
      </button>
    </form>
  </section>
</main>
